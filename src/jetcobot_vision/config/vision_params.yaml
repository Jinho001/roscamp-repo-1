# vision_params.yaml
# 노드 이름이 launch 파일의 name= 과 반드시 일치해야 합니다.

detect_bridge_node:
  ros__parameters:
    server_url:      "http://192.168.1.4:8081/latest"  # 메인 PC cv_detect_server.py
    poll_hz:         10.0
    request_timeout: 1.0

coord_transform_node:
  ros__parameters:
    # handeye_result.yaml T_ee2cam (row-major 4×4)
    handeye_matrix:
      - 0.9955181180385095
      - -0.09236211587032309
      - -0.02032033978606575
      - 0.0004237468556380977
      - 0.09215089442325214
      - 0.9956832022377156
      - -0.011098352969840833
      - -0.07245503146972071
      - 0.021257688351718585
      - 0.009176073975592695
      - 0.9997319192425216
      - 0.04859228254585788
      - 0.0
      - 0.0
      - 0.0
      - 1.0
    # camera_info.yaml [fx, fy, cx, cy]
    camera_intrinsics:
      - 1000.4208004615881
      - 999.3603949999673
      - 253.87976012235055
      - 242.88307511826676
    # workspace_config.yaml observe_pose["tray"]
    observe_pose:
      - -62.4
      - -87.9
      - 314.2
      - -161.81
      - 0.94
      - -179.37
    z_surface_mm: 95.0
    obb_topic:    "/detect_bridge_node/obb_boxes"

vision_pick_node:
  ros__parameters:
    port:                  "/dev/ttyJETCOBOT"
    baud:                  1000000
    grasp_roll:            -178.81
    grasp_pitch:           0.94
    grasp_yaw_offset:      0.0
    tcp_offset:
      - 0.0
      - 20.0
      - 110.0
    pick_z_offset_mm:      20.0
    detect_timeout_sec:    10.0
    coord_topic:           "/coord_transform_node/pick_point"
    cv_server_url:         "http://192.168.1.4:8081"  # 메인 PC cv_detect_server.py
    coord_enable_service:  "/coord_transform_node/enable"

vision_place_node:
  ros__parameters:
    port:                  "/dev/ttyJETCOBOT"
    baud:                  1000000
    grasp_roll:            -178.81
    grasp_pitch:           0.94
    grasp_yaw_offset:      0.0
    tcp_offset:
      - 0.0
      - 20.0
      - 110.0
    pick_z_offset_mm:      20.0
    detect_timeout_sec:    10.0
    coord_topic:           "/coord_transform_node/pick_point"
    cv_server_url:         "http://192.168.1.4:8081"
    coord_enable_service:  "/coord_transform_node/enable"
